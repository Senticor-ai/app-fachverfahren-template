# Codesphere-Deploy-Pipeline (GovTech-DE-Plattform, vendorportal.gtplatforms.org).
# Dies ist die Laufzeit-Wahrheit, die `cs start pipeline prepare test run` ausführt — sie SPIEGELT das Dockerfile
# (dasselbe Build-Rezept: corepack→pnpm install→build:packages/app/server), damit Codesphere-Deploy und Container-Build
# NICHT auseinanderlaufen (eine Wahrheit). Der Server lauscht auf $PORT (Default 8080; Codesphere setzt $PORT) und
# einem internen Port 9090. Kein floating Tag / kein `latest` — reproduzierbar wie der Dockerfile-Build.
schemaVersion: v0.2

prepare:
  steps:
    - name: Enable pnpm
      command: corepack enable pnpm && corepack prepare pnpm@11.1.0 --activate
    - name: Install (frozen lockfile)
      command: pnpm install --frozen-lockfile
    - name: Build packages + app + server
      command: pnpm run build:packages && pnpm run build:app && pnpm run build:server

test:
  # NUR das `unit`-Projekt: die vitest-Konfiguration dieser Vorlage trennt bereits
  # `template-tooling` (tooling/template/**, mkdtemp + Full-Repo-Render + Subprozesse, 120s-Budget)
  # von `unit` (alles andere). Im Deploy-Tor einer GENERIERTEN App hat die Selbstpruefung des
  # GENERATORS nichts zu suchen -- sie blockierte den Rollout mit 8 Fehlschlaegen, davon 5 auch bei
  # 120s (Codesphere-Workspace, 2026-08-23). Im Vorlagen-Repo laeuft sie weiter ueber `pnpm test`
  # bzw. `pnpm run test:template`. Wir schneiden also NICHT die Konfiguration auf, sondern waehlen
  # das Projekt -- die Trennung existiert schon.
  steps:
    - name: Validate (typecheck + unit)
      command: pnpm run --if-present typecheck && pnpm vitest run --project unit

# SCHEMA-HINWEIS (hart erkauft): unter `run:` MUSS ein BENANNTER Service stehen, mit `network.ports`
# und `network.paths`. Die wrapper-lose Form (`run: steps:`) liess `cs start pipeline` mit
# `500 (An internal error occurred)` scheitern -- ohne Validierungsfehler, was die Ursache verdeckte
# (Trace-IDs SYaKGPD, laqdIQC, 2026-08-23). Codesphere-Support hat dieselbe Wrapper-Pflicht schon fuer
# die CHOS-Landscape bestaetigt. Also: NICHT den Wrapper entfernen.
#
# plan 402 = Pro on-demand (8 CPU / 16 GiB) statt der 1 CPU / 2 GiB des Standard-Plans 101: auf 101
# brauchten die Tests der generierten App 625s und die Render-Tests rissen selbst 120s.
run:
  fachverfahren:
    steps:
      - name: Fachverfahren-Server
        command: PORT=3000 node apps/fachverfahren/dist-server/index.js
    plan: 402
    replicas: 1
    network:
      ports:
        - port: 3000
          isPublic: true
      paths:
        - port: 3000
          path: /
